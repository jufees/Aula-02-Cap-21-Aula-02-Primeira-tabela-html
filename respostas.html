<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>

<style>
    table {
        width: 400px;
        border-collapse: collapse;

        td {
            border: 1px solid rgb(224, 109, 109);
            padding: 8px;
        }

    }

    td.dado {
        background-color: rgb(0, 255, 98);
    }

    .linha-destaque {
        background-color: cadetblue;
    }

    .campo-destaque {
        background-color: aquamarine;
    }
</style>

<body>
    <h1>Exemplo esperado de saída</h1>
    <table>
        <tr class="linha-destaque">
            <td>Nome do produto</td>
            <td>Categoria</td>
            <td>Preço (R$)</td>
            <td>Estoque</td>
        </tr>
        <tr>
            <td>Camiseta</td>
            <td>Vestuário</td>
            <td>49,90</td>
            <td>20</td>
        </tr>
        <tr>
            <td class="campo-destaque">Notebook</td>
            <td>Eletrônicos</td>
            <td>3500,00</td>
            <td>5</td>
        </tr>
        <tr>
            <td>Café Gourmet</td>
            <td>Alimentos</td>
            <td>29,90</td>
            <td>15</td>
        </tr>
    </table>
</body>

</html>
